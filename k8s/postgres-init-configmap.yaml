# ConfigMap contenant le script de migration initial (migrations/0001_init.sql
# du repo), monte dans le conteneur Postgres via le dossier standard
# /docker-entrypoint-initdb.d/ (l'image postgres:16-alpine execute
# automatiquement tous les .sql qui s'y trouvent, une seule fois, au tout
# premier demarrage du volume de donnees -- donc PAS rejoue si le PVC existe
# deja, exactement comme avec docker-compose).
#
# ATTENTION : si le schema evolue (migrations/0002_*.sql, etc.), il faudra
# soit ajouter une nouvelle cle ici (ex: 0002_xxx.sql -- s'applique
# uniquement sur une base neuve), soit gerer les migrations sur une base
# deja existante via un outil de migration applicatif a part (golang-migrate,
# un Job kubectl one-shot, etc.) -- ce ConfigMap ne rejoue rien sur un
# cluster deja initialise.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: abmcy
data:
  0001_init.sql: |
    -- ABMCY Core Multi-Tenant — schema initial + Row Level Security
    -- Toutes les tables "métier" portent tenant_id et sont protégées par RLS :
    -- même si une requête applicative oublie un WHERE tenant_id = ..., Postgres
    -- refuse de renvoyer/modifier les lignes d'un autre tenant.

    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    -- ============================================================
    -- TENANTS (table système, pas de RLS : gérée uniquement via WithSystem)
    -- ============================================================
    CREATE TABLE tenants (
        id                   UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name                 VARCHAR(100) NOT NULL,          -- ex: "HANI'S"
        slug                 VARCHAR(100) UNIQUE NOT NULL,    -- ex: "hanis" -> hanis.dash.abmcy.com
        contact_email        VARCHAR(255),                    -- email du tenant (bienvenue, factures, alertes ABMCY -> tenant)
        api_key_public       VARCHAR(255) UNIQUE NOT NULL,
        api_key_secret_hash  VARCHAR(255) NOT NULL,           -- bcrypt hash, jamais la clé en clair
        plan                 VARCHAR(30) NOT NULL DEFAULT 'free', -- free | starter | pro | enterprise
        business_type        VARCHAR(50) NOT NULL DEFAULT 'general',
            -- couture_sur_mesure | commerce_general | produit_numerique | general
            -- Indique au dashboard quel jeu de champs `products.attributes`
            -- proposer par défaut (tailles/couleurs, stock/SKU, lien de
            -- téléchargement...). Un tenant reste libre d'utiliser n'importe
            -- quel attribut quel que soit son business_type.
        storage_limit_bytes  BIGINT NOT NULL DEFAULT 5368709120,  -- 5 Go
        storage_used_bytes   BIGINT NOT NULL DEFAULT 0,
        email_quota_per_day  INT NOT NULL DEFAULT 100,
        email_sent_today     INT NOT NULL DEFAULT 0,
        email_quota_reset_at DATE NOT NULL DEFAULT CURRENT_DATE,
        rate_limit_per_sec   INT NOT NULL DEFAULT 5,   -- requêtes/s soutenues autorisées
        rate_limit_burst     INT NOT NULL DEFAULT 20,  -- pic instantané toléré
        is_active            BOOLEAN NOT NULL DEFAULT TRUE,
        created_at           TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at           TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- ============================================================
    -- USERS (comptes humains : super-admin ABMCY + utilisateurs d'un tenant)
    -- ============================================================
    CREATE TABLE users (
        id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id     UUID REFERENCES tenants(id) ON DELETE CASCADE, -- NULL pour un super-admin ABMCY
        email         VARCHAR(255) NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        role          VARCHAR(30) NOT NULL DEFAULT 'owner', -- owner | staff | super_admin
        is_active     BOOLEAN NOT NULL DEFAULT TRUE,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        UNIQUE (tenant_id, email)
    );

    -- Postgres traite chaque NULL comme distinct dans une contrainte UNIQUE
    -- classique : UNIQUE(tenant_id, email) ne bloque donc PAS deux comptes
    -- super-admin (tenant_id NULL) avec le même email. Cet index partiel
    -- couvre spécifiquement ce cas.
    CREATE UNIQUE INDEX idx_users_super_admin_email ON users (email) WHERE tenant_id IS NULL;

    ALTER TABLE users ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_users ON users
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    -- ============================================================
    -- TENANT FEATURES (activation à la carte du service catalogue par tenant
    -- — un tenant qui vend déjà via WhatsApp/en boutique peut n'avoir besoin
    -- que des commandes sur-mesure, sans catalogue/panier/avis publics.
    -- Activé/désactivé depuis le dashboard super-admin. Table système, pas de
    -- RLS : gérée uniquement via WithSystem, comme platform_config).
    -- ============================================================
    CREATE TABLE tenant_features (
        tenant_id       UUID PRIMARY KEY REFERENCES tenants(id) ON DELETE CASCADE,
        catalog_enabled BOOLEAN NOT NULL DEFAULT FALSE, -- produits, tissus, panier, galerie, avis
        updated_at      TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- ============================================================
    -- PRODUCTS / CATALOG
    --
    -- Le catalogue est générique : name/description/price/category/images sont
    -- communs à tout type de commerce. Les champs propres à un secteur
    -- (tailles/couleurs pour la couture, lien de téléchargement pour le
    -- numérique, référence fournisseur pour un commerce général, ...) vivent
    -- dans `attributes` (JSONB libre) plutôt que dans des colonnes dédiées —
    -- ça évite d'ajouter une colonne par secteur d'activité à chaque nouveau
    -- type de tenant. `business_type` sur tenants (voir plus bas) indique au
    -- dashboard quel jeu de champs `attributes` proposer par défaut, mais
    -- n'importe quel tenant peut y mettre ce qu'il veut.
    -- ============================================================
    CREATE TABLE products (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id   UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        name        VARCHAR(150) NOT NULL,
        description TEXT,
        price       INT NOT NULL,           -- en FCFA
        category    VARCHAR(100),           -- libre : ex "robes" (couture) ou "épicerie" (commerce général)
        sku         VARCHAR(100),           -- référence produit, utile hors couture
        stock_quantity INT,                 -- NULL = stock illimité/non suivi (ex: sur-mesure, numérique)
        attributes  JSONB,                  -- libre, structure dépendant du business_type du tenant
                                             -- ex couture: {"gender":"femme","sizes":["S","M","L"],"colors":["Bleu nuit"]}
                                             -- ex numérique: {"download_url":"...","file_size_mb":12,"license":"perso"}
                                             -- ex commerce général: {"brand":"...","weight_kg":1.5}
        is_featured BOOLEAN NOT NULL DEFAULT FALSE, -- "meilleures ventes" / mise en avant
        is_active   BOOLEAN NOT NULL DEFAULT TRUE,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE products ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_products ON products
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_products_tenant ON products(tenant_id);
    CREATE INDEX idx_products_tenant_active ON products(tenant_id, is_active);

    -- ============================================================
    -- FABRICS (galerie de tissus proposés par l'atelier — indépendante des
    -- product_images, qui restent pour les photos de produits finis)
    -- ============================================================
    CREATE TABLE fabrics (
        id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id     UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        name          VARCHAR(150) NOT NULL,
        description   TEXT,
        extra_price   INT NOT NULL DEFAULT 0, -- supplément en FCFA
        image_url     TEXT,
        is_active     BOOLEAN NOT NULL DEFAULT TRUE,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE fabrics ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_fabrics ON fabrics
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_fabrics_tenant ON fabrics(tenant_id);

    -- ============================================================
    -- GALLERY PHOTOS (photos de réalisations, catégorisées : Femme, Homme,
    -- Sur mesure, Artisanat — distinctes des product_images qui sont liées à
    -- une fiche produit précise)
    -- ============================================================
    CREATE TABLE gallery_photos (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id   UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        image_url   TEXT NOT NULL,
        category    VARCHAR(50), -- femme | homme | sur_mesure | artisanat
        caption     VARCHAR(255),
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE gallery_photos ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_gallery_photos ON gallery_photos
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_gallery_photos_tenant ON gallery_photos(tenant_id, category);

    -- ============================================================
    -- CUSTOMERS (profil client, identifié par téléphone). Un client peut
    -- exister sans jamais avoir défini de mot de passe (créé automatiquement
    -- à la première commande sur-mesure, voir catalog.CustomerService) — le
    -- mot de passe est optionnel et n'est requis que pour se connecter et
    -- consulter son historique/profil en ligne via /auth/customer/*.
    -- shipping_address stocke la dernière adresse utilisée, en repli pour
    -- GET/PATCH /auth/customer/me.
    -- ============================================================
    CREATE TABLE customers (
        id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id       UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        name            VARCHAR(100) NOT NULL,
        phone           VARCHAR(20) NOT NULL,
        email           VARCHAR(255),
        shipping_address TEXT,
        password_hash   VARCHAR(255),        -- NULL tant que le client n'a pas créé de compte
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        UNIQUE (tenant_id, phone)
    );

    ALTER TABLE customers ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_customers ON customers
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_customers_tenant ON customers(tenant_id);

    -- Un email n'est pas obligatoire (identification principale = téléphone),
    -- mais quand il est présent et qu'un mot de passe est défini, il doit
    -- être unique par tenant pour permettre le login par email + mot de passe
    -- et l'envoi du lien de réinitialisation.
    CREATE UNIQUE INDEX idx_customers_tenant_email ON customers (tenant_id, email) WHERE email IS NOT NULL;

    -- ============================================================
    -- CUSTOMER PASSWORD RESET TOKENS (lien "mot de passe oublié" envoyé par
    -- email via Resend — un token à usage unique, expirant, jamais le mot de
    -- passe lui-même en clair nulle part).
    -- ============================================================
    CREATE TABLE customer_password_resets (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id   UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        customer_id UUID NOT NULL REFERENCES customers(id) ON DELETE CASCADE,
        token_hash  VARCHAR(255) NOT NULL, -- sha256 du token envoyé par email, jamais le token en clair
        expires_at  TIMESTAMPTZ NOT NULL,
        used_at     TIMESTAMPTZ,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE customer_password_resets ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_customer_password_resets ON customer_password_resets
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_customer_password_resets_token ON customer_password_resets(token_hash);

    -- ============================================================
    -- REVOKED TOKENS (liste de révocation pour le logout — un JWT classique
    -- n'est pas invalidable avant son expiration naturelle sans état côté
    -- serveur ; on enregistre son jti jusqu'à l'expiration qu'il portait déjà,
    -- après quoi la ligne est un déchet inoffensif à purger périodiquement.
    -- Table système, pas de RLS : utilisée par n'importe quel type de JWT
    -- (client, tenant, admin) via son jti, pas scopée à un tenant).
    -- ============================================================
    CREATE TABLE revoked_tokens (
        jti         VARCHAR(64) PRIMARY KEY,
        expires_at  TIMESTAMPTZ NOT NULL,
        revoked_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX idx_revoked_tokens_expires ON revoked_tokens(expires_at);

    -- ============================================================
    -- MEASUREMENTS (mesures sur-mesure d'un client, versionnées : un client
    -- peut reprendre ses mesures ; on garde l'historique plutôt que d'écraser)
    -- ============================================================
    CREATE TABLE measurements (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id   UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        customer_id UUID NOT NULL REFERENCES customers(id) ON DELETE CASCADE,
        gender      VARCHAR(20) NOT NULL, -- femme | homme (détermine les champs attendus côté API)
        measurement_values JSONB NOT NULL, -- ex femme: {poitrine, taille, hanches, epaules, manches, longueur}
                                            -- ex homme: + pantalon
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE measurements ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_measurements ON measurements
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_measurements_tenant_customer ON measurements(tenant_id, customer_id);

    -- ============================================================
    -- CART ITEMS (panier sauvegardé côté serveur, pas juste localStorage —
    -- identifié par un cart_token opaque généré côté client au premier ajout,
    -- pas de session serveur ni de compte requis)
    -- ============================================================
    CREATE TABLE cart_items (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id   UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        cart_token  VARCHAR(64) NOT NULL,
        product_id  UUID NOT NULL REFERENCES products(id) ON DELETE CASCADE,
        fabric_id   UUID REFERENCES fabrics(id) ON DELETE SET NULL,
        size        VARCHAR(20),
        color       VARCHAR(50),
        quantity    INT NOT NULL DEFAULT 1,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE cart_items ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_cart_items ON cart_items
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_cart_items_tenant_token ON cart_items(tenant_id, cart_token);

    -- ============================================================
    -- PRODUCT IMAGES (uploadées sur Cloudflare R2, on garde juste l'URL + le poids)
    -- ============================================================
    CREATE TABLE product_images (
        id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id    UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        product_id   UUID REFERENCES products(id) ON DELETE CASCADE,
        image_url    TEXT NOT NULL,
        size_bytes   BIGINT NOT NULL,
        created_at   TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE product_images ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_product_images ON product_images
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_product_images_tenant ON product_images(tenant_id);

    -- ============================================================
    -- ORDERS (commandes standards ET sur-mesure : les colonnes sur-mesure
    -- restent NULL pour une commande catalogue classique)
    -- ============================================================
    CREATE TABLE orders (
        id              UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id       UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        order_number    VARCHAR(50) NOT NULL,
        customer_id     UUID REFERENCES customers(id) ON DELETE SET NULL,
        customer_name   VARCHAR(100) NOT NULL,
        customer_phone  VARCHAR(20) NOT NULL,
        customer_email  VARCHAR(255),
        shipping_address TEXT,
        total_amount    INT NOT NULL,          -- FCFA (produits + tissu + livraison)
        status          VARCHAR(30) NOT NULL DEFAULT 'pending',
            -- pending|confirmed|paid|in_progress|shipped|delivered|cancelled
        measurements    JSONB,                 -- snapshot au moment de la commande (voir aussi measurements.id ci-dessous)
        measurements_id UUID REFERENCES measurements(id) ON DELETE SET NULL,
        fabric_id       UUID REFERENCES fabrics(id) ON DELETE SET NULL,
        fabric_source   VARCHAR(30),           -- maison | envoi_photo | conseil_atelier
        notes           TEXT,                  -- commentaires particuliers du client
        created_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
        UNIQUE (tenant_id, order_number)
    );

    ALTER TABLE orders ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_orders ON orders
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_orders_tenant ON orders(tenant_id);
    CREATE INDEX idx_orders_status ON orders(tenant_id, status);

    -- ============================================================
    -- ORDER STATUS HISTORY (traçabilité des changements de statut, affichée
    -- au client comme "historique des mises à jour" de sa commande)
    -- ============================================================
    CREATE TABLE order_status_history (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id   UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        order_id    UUID NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
        status      VARCHAR(30) NOT NULL,
        comment     TEXT,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE order_status_history ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_order_status_history ON order_status_history
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_order_status_history_order ON order_status_history(tenant_id, order_id, created_at);

    -- ============================================================
    -- REVIEWS (avis client après livraison, modérés par l'atelier avant
    -- publication — is_published reste FALSE jusqu'à validation manuelle)
    -- ============================================================
    CREATE TABLE reviews (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id   UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        order_id    UUID REFERENCES orders(id) ON DELETE SET NULL,
        customer_id UUID REFERENCES customers(id) ON DELETE SET NULL,
        rating      SMALLINT NOT NULL CHECK (rating BETWEEN 1 AND 5),
        comment     TEXT,
        photo_urls  JSONB,               -- tableau d'URLs (uploadées via /uploads/image)
        is_published BOOLEAN NOT NULL DEFAULT FALSE,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE reviews ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_reviews ON reviews
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_reviews_tenant_published ON reviews(tenant_id, is_published);

    -- ============================================================
    -- PAYMENTS (traces des transactions CinetPay / Stripe)
    -- ============================================================
    CREATE TABLE payments (
        id             UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id      UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        order_id       UUID NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
        provider       VARCHAR(30) NOT NULL,   -- cinetpay | stripe
        provider_ref   VARCHAR(255) NOT NULL,
        amount         INT NOT NULL,
        status         VARCHAR(30) NOT NULL DEFAULT 'initiated', -- initiated|success|failed
        raw_payload    JSONB,
        created_at     TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE payments ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_payments ON payments
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_payments_tenant ON payments(tenant_id);

    -- ============================================================
    -- EMAIL LOG (traçabilité des envois Resend + quota de 100/jour)
    -- ============================================================
    CREATE TABLE email_logs (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id   UUID NOT NULL REFERENCES tenants(id) ON DELETE CASCADE,
        to_address  VARCHAR(255) NOT NULL,
        subject     VARCHAR(255) NOT NULL,
        template    VARCHAR(100),
        status      VARCHAR(30) NOT NULL DEFAULT 'sent', -- sent|failed
        resend_id   VARCHAR(255),
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE email_logs ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_isolation_email_logs ON email_logs
        USING (tenant_id = current_setting('app.tenant_id', true)::uuid);

    CREATE INDEX idx_email_logs_tenant_date ON email_logs(tenant_id, created_at);

    -- ============================================================
    -- PLATFORM CONFIG (clés de service globales à ABMCY : R2, Resend, CinetPay,
    -- ADMIN_API_KEY — saisies/modifiées depuis le dashboard super-admin plutôt
    -- que figées dans des fichiers .env sur le serveur. Table système, pas de
    -- RLS : accessible uniquement via WithSystem, jamais scopée à un tenant).
    -- Les valeurs sont chiffrées côté application (AES-GCM) avant d'être
    -- écrites ici — cette table ne contient jamais de secret en clair, même en
    -- cas de fuite du dump SQL. La clé de chiffrement elle-même reste dans
    -- l'environnement (CONFIG_ENCRYPTION_KEY), c'est la seule qui doit rester
    -- un vrai secret serveur — voir internal/platformconfig/.
    -- ============================================================
    CREATE TABLE platform_config (
        key           VARCHAR(100) PRIMARY KEY, -- ex: "R2_ACCESS_KEY_ID"
        value_encrypted BYTEA NOT NULL,
        updated_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_by    UUID REFERENCES users(id) ON DELETE SET NULL
    );

    -- ============================================================
    -- REQUEST LOGS (traçabilité légère du trafic par tenant, pour la vue
    -- "trafic" du dashboard super-admin : volumétrie, erreurs, endpoints les
    -- plus utilisés. Pas de RLS car consultée uniquement par le super-admin
    -- via WithSystem ; purge/rétention à gérer par un job périodique — voir
    -- k8s/README.md pour l'ajout futur d'un CronJob de nettoyage).
    -- ============================================================
    CREATE TABLE request_logs (
        id           BIGSERIAL PRIMARY KEY,
        tenant_id    UUID REFERENCES tenants(id) ON DELETE CASCADE,
        method       VARCHAR(10) NOT NULL,
        path         VARCHAR(255) NOT NULL,
        status_code  INT NOT NULL,
        duration_ms  INT NOT NULL,
        rate_limited BOOLEAN NOT NULL DEFAULT FALSE,
        created_at   TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX idx_request_logs_tenant_date ON request_logs(tenant_id, created_at);
    CREATE INDEX idx_request_logs_date ON request_logs(created_at);

    -- ============================================================
    -- Rôle applicatif : la connexion pool utilise ce rôle, jamais le
    -- superuser Postgres, pour que les policies RLS s'appliquent vraiment
    -- (un superuser/owner de table BYPASS RLS par défaut).
    -- ============================================================
    -- CREATE ROLE abmcy_app LOGIN PASSWORD '...';
    -- GRANT CONNECT ON DATABASE abmcy TO abmcy_app;
    -- GRANT USAGE ON SCHEMA public TO abmcy_app;
    -- GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO abmcy_app;
