# Ingress nginx (ingress-nginx, contrôleur déjà présent sur ce cluster
# aux côtés du projet Diarra) pour router api.abmcy.com vers le Service
# api du namespace abmcy.
#
# Le TLS public N'EST PAS géré ici : ce VPS a Caddy en frontal sur les
# ports 80/443 (déjà utilisé par Diarra), qui obtient lui-même un vrai
# certificat Let's Encrypt pour api.abmcy.com et fait suivre en HTTP
# clair vers ingress-nginx (NodePort 30080) avec le header Host fixé —
# voir le bloc `api.abmcy.com { reverse_proxy 127.0.0.1:30080 ... }`
# ajouté dans /etc/caddy/Caddyfile sur le VPS. cert-manager n'est donc
# pas utilisé pour ce domaine (il reste installé sur le cluster : il ne
# fait de mal à personne, mais aucune Certificate ne le référence ici).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: abmcy
spec:
  ingressClassName: nginx
  rules:
    - host: api.abmcy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
