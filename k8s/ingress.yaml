# Ingress Traefik (contrôleur par défaut de k3s, pas besoin de l'installer)
# pour exposer l'API en HTTPS sur api.abmcy.com. cert-manager surveille
# l'annotation cert-manager.io/cluster-issuer et provisionne/renouvelle
# automatiquement le certificat Let's Encrypt dans le Secret référencé par
# tls.secretName.
#
# NOTE : on ne force PAS de redirection HTTP -> HTTPS ici via annotation.
# Le solver http01 du ClusterIssuer (voir cluster-issuer.yaml) a besoin de
# répondre en clair sur le port 80 pour valider le domaine avant que le
# certificat n'existe. Une fois le certificat émis, la section tls ci-dessous
# suffit à servir en HTTPS ; une redirection globale HTTP->HTTPS peut être
# ajoutée plus tard via un Middleware Traefik dédié une fois le certificat
# confirmé opérationnel.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: abmcy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.abmcy.com
      secretName: api-abmcy-com-tls
  rules:
    - host: api.abmcy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
