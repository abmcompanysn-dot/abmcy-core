# ClusterIssuer cert-manager pour Let's Encrypt (production).
#
# NON UTILISÉ dans le déploiement actuel sur diarra-vps : ce VPS a Caddy
# en frontal sur les ports 80/443 (déjà utilisé par le projet Diarra),
# qui obtient lui-même le certificat de api.abmcy.com — voir le
# commentaire en tête de k8s/ingress.yaml. cert-manager reste installé
# sur ce cluster (inoffensif) mais ce ClusterIssuer n'est référencé par
# aucune Certificate. Gardé pour un futur déploiement sur un cluster où
# ingress-nginx recevrait directement le trafic 80/443 (pas de Caddy
# devant) — dans ce cas, remettre l'annotation
# cert-manager.io/cluster-issuer + la section tls: dans l'Ingress.
#
# Suppose que cert-manager est déjà installé dans le cluster (voir
# k8s/README.md pour la commande d'installation) — ce n'est PAS un
# CRD standard de Kubernetes, il vient du contrôleur cert-manager.
#
# ClusterIssuer (et non Issuer) car il n'est pas limité à un seul
# namespace : réutilisable si d'autres namespaces/ingress apparaissent
# plus tard sur ce cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # IMPORTANT : remplacer par une vraie adresse email de contact ABMCY —
    # Let's Encrypt l'utilise pour prévenir en cas de problème (expiration,
    # révocation, etc.), elle n'est pas publiée ailleurs.
    email: admin@abmcy.com
    privateKeySecretRef:
      # Secret créé/géré automatiquement par cert-manager (clé de compte
      # ACME) — ne pas confondre avec abmcy-secrets.
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            # nginx, pas traefik : ce cluster utilise ingress-nginx comme
            # contrôleur (installé aux côtés du projet Diarra déjà présent
            # sur ce VPS), pas le Traefik livré par défaut avec un k3s "stock".
            class: nginx
