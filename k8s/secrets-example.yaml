# =============================================================================
# EXEMPLE de Secret Kubernetes — NE PAS appliquer tel quel en production.
# Toutes les valeurs ci-dessous sont des placeholders. Ce fichier est fait
# pour être commité (il documente les clés attendues), mais le vrai Secret
# avec les vraies valeurs ne doit JAMAIS être commité dans git.
#
# Deux façons de créer le vrai Secret :
#
# 1) Impérativement, à partir du fichier .env existant à la racine du repo
#    (voir k8s/README.md pour la commande complète avec kubectl create secret
#    generic ... --from-env-file=.env) — la méthode recommandée, rien ne
#    touche le disque en clair sous forme de manifest.
#
# 2) Copier ce fichier vers un fichier NON commité (ex: k8s/secrets.local.yaml,
#    déjà à ajouter dans .gitignore), remplacer les placeholders par les
#    vraies valeurs en clair (Kubernetes attend du stringData, pas du base64,
#    voir plus bas), puis `kubectl apply -f k8s/secrets.local.yaml`.
#
# Ce fichier n'est PAS référencé par kustomization.yaml pour éviter qu'un
# `kubectl apply -k k8s/` écrase le vrai secret avec ces placeholders.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: abmcy-secrets
  namespace: abmcy
type: Opaque
# stringData : Kubernetes encode automatiquement en base64 à l'apply.
# Plus pratique que "data" (qui exige des valeurs déjà en base64 à la main).
stringData:
  # Mot de passe du rôle applicatif Postgres (abmcy_app). Doit correspondre
  # au mot de passe encodé dans DATABASE_URL ci-dessous.
  POSTGRES_PASSWORD: "changeme-postgres-password"

  # Chaîne de connexion complète utilisée par le binaire Go. Le host "postgres"
  # correspond au Service ClusterIP défini dans postgres-statefulset.yaml —
  # la résolution DNS interne au namespace suffit (pas besoin du FQDN complet).
  DATABASE_URL: "postgres://abmcy_app:changeme-postgres-password@postgres:5432/abmcy?sslmode=disable"

  # Secret de signature JWT — chaîne aléatoire longue (32+ caractères).
  JWT_SECRET: "changeme-please-generate-a-long-random-string"

  # Cloudflare R2 — upload d'images produits/tissus (bucket S3-compatible).
  R2_ACCOUNT_ID: "changeme-r2-account-id"
  R2_ACCESS_KEY_ID: "changeme-r2-access-key-id"
  R2_SECRET_ACCESS_KEY: "changeme-r2-secret-access-key"
  R2_BUCKET: "abmcy-uploads"
  R2_PUBLIC_URL: "https://img.abmcy.com"

  # https://resend.com/ — envoi d'emails transactionnels.
  RESEND_API_KEY: "changeme-resend-api-key"
  RESEND_FROM_ADDR: "ABMCY <no-reply@abmcy.com>"

  # https://cinetpay.com/ — paiements (Wave, Orange Money, MTN MoMo, cartes).
  CINETPAY_API_KEY: "changeme-cinetpay-api-key"
  CINETPAY_SITE_ID: "changeme-cinetpay-site-id"

  # Clé d'API pour les routes super-admin (création de tenants, etc.).
  ADMIN_API_KEY: "changeme-super-admin-key"
