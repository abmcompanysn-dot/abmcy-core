# Deployment du binaire Go (modulith unique, cmd/api/main.go).
#
# ATTENTION : ce VPS (diarra-vps, 4 CPU / 7.8 Go RAM) héberge déjà un
# autre projet ("Diarra") tournant dans le namespace k3s "diarra"
# (backend 2 répliques, Postgres, Redis, MinIO — ~40% CPU / 25% RAM déjà
# utilisés en usage réel constaté avant même de déployer ABMCY). ABMCY
# vit dans son propre namespace ("abmcy") à côté, sans y toucher, mais
# partage le même nœud physique — les requests/limits ci-dessous sont
# volontairement modestes pour rester un bon voisin. 2 répliques restent
# raisonnables ici car les requests par pod sont faibles (100m CPU/128Mi
# chacun, 200m/256Mi au total pour les deux) ; permet un rolling update
# sans coupure de service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: abmcy
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # jamais 0 pod disponible pendant un déploiement
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Image buildée localement depuis le Dockerfile existant et chargée
          # dans containerd (k3s ctr images import) — voir k8s/README.md.
          image: abmcy/core-api:latest
          # IfNotPresent : évite que k3s essaie de pull depuis un registry
          # distant puisque l'image est chargée localement via containerd.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APP_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: CORS_ORIGINS
              value: "https://dash.abmcy.com,https://ad.abmcy.com"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: abmcy-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: abmcy-secrets
                  key: JWT_SECRET
            - name: CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: abmcy-secrets
                  key: CONFIG_ENCRYPTION_KEY
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: abmcy-secrets
                  key: ADMIN_API_KEY
            # R2/Resend/CinetPay ne sont PLUS injectées ici : elles se
            # configurent depuis le dashboard admin (page Configuration),
            # stockées chiffrées en base (table platform_config) via
            # internal/platformconfig — voir CONFIG_ENCRYPTION_KEY ci-dessus.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "750m"
              memory: "512Mi"
          # readiness : retire le pod du Service tant qu'il n'a pas répondu
          # une première fois — utile pendant un rolling update.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness : redémarre le pod s'il devient injoignable durablement
          # (deadlock applicatif, connexion DB bloquée, etc.).
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
